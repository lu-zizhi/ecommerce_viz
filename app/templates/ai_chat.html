{% extends 'base.html' %}
{% block content %}

<div class="page-header">
    <h4><i class="bi bi-robot text-primary me-2"></i>智能数据分析助手</h4>
    <p>支持多轮追加提问，点击历史对话气泡可实时回溯数据图表</p>
</div>

<div class="row g-3" style="height:calc(100vh - 180px);">

    <div class="col-md-4 d-flex flex-column" style="height:100%;">

        <div class="chart-card mb-3" style="flex-shrink:0;">
            <div class="chart-title" style="margin-bottom:10px;">
                <i class="bi bi-lightbulb"></i>推荐问题
            </div>
            <div>
                <button class="suggest-btn" onclick="ask('每个品类的销售额是多少？用饼图展示')">各品类销售额占比</button>
                <button class="suggest-btn" onclick="ask('把刚才的图表换成折线图展示趋势')">追问：换成折线图</button>
                <button class="suggest-btn" onclick="ask('销售额最高的10个省份是哪些？')">Top10省份排行</button>
                <button class="suggest-btn" onclick="ask('其中属于B2B部分的有多少？')">追问：过滤出B2B</button>
            </div>
        </div>

        <div class="chart-card d-flex flex-column" style="flex:1; overflow:hidden; padding:16px;">
            <div class="chart-title" style="margin-bottom:10px; flex-shrink:0;">
                <i class="bi bi-chat-dots"></i>对话记录 (点击AI气泡可回溯)
            </div>
            <div id="chat-history" style="flex:1; overflow-y:auto; padding-right:4px;">
                </div>

            <div class="d-flex gap-2 mt-2" style="flex-shrink:0;">
                <input type="text" id="query-input" placeholder="输入问题或连续追问，按 Enter 发送..." class="form-control form-control-sm" style="font-size:13px;" onkeydown="if(event.key==='Enter') sendQuery()">
                <button onclick="sendQuery()" id="send-btn" class="btn btn-primary btn-sm" style="white-space:nowrap; padding:0 16px;">
                    <i class="bi bi-send-fill"></i>
                </button>
            </div>
        </div>
    </div>

    <div class="col-md-8 d-flex flex-column" style="height:100%; overflow-y:auto;">
        <div id="empty-state" class="chart-card d-flex align-items-center justify-content-center" style="flex:1; min-height:400px;">
            <div style="text-align:center; color:#bfbfbf;">
                <i class="bi bi-robot" style="font-size:52px; display:block; margin-bottom:16px; color:#d9d9d9;"></i>
                <div style="font-size:15px; margin-bottom:6px; color:#8c8c8c;">AI 智能分析沙盒已就绪</div>
                <div style="font-size:13px;">输入连续的自然语言指令，探索跨境大盘内部深层联系</div>
            </div>
        </div>

        <div id="result-area" style="display:none;">
            <div class="chart-card mb-3" style="background:linear-gradient(135deg,#fffbe6,#fff8dc); border:1px solid #ffe58f;">
                <div class="chart-title" style="border-bottom:1px solid #ffe58f; color:#874d00;">
                    <i class="bi bi-stars" style="color:#faad14;"></i>AI 智能决策辅助
                </div>
                <div id="insight-text" style="font-size:14px; color:#614700; line-height:1.8;"></div>
            </div>

            <div class="chart-card mb-3">
                <div class="d-flex justify-content-between align-items-center mb-3" style="padding-bottom:12px; border-bottom:1px solid #f5f5f5;">
                    <div class="chart-title" style="margin:0; border:none; padding:0;">
                        <i class="bi bi-bar-chart"></i>
                        <span id="chart-title">分析结果</span>
                    </div>
                    <button class="btn btn-outline-secondary btn-sm" onclick="toggleSQL()" style="font-size:12px;">
                        <i class="bi bi-code-slash me-1"></i>查看核心 SQL
                    </button>
                </div>
                <div id="sql-box" style="display:none; margin-bottom:12px;">
                    <pre id="sql-text" style="background:#1e1e2e; color:#cdd6f4; border-radius:8px; padding:14px; font-size:12px; overflow-x:auto; margin:0; line-height:1.6;"></pre>
                </div>
                <div id="main-chart" style="height:420px;"></div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<script>
let chart = null;
// 🌟 核心前端注册表：缓存所有历史图表的大数据包，供点击气泡瞬间回溯
window.chatDataRegistry = {};

window.onload = function() {
    // 页面加载时自动从后端捞取该用户的历史多轮聊天记录
    fetch('/ai/history')
        .then(r => r.json())
        .then(messages => {
            if(messages.length > 0) {
                document.getElementById('chat-history').innerHTML = '';
                messages.forEach(msg => {
                    if(msg.role === 'user') {
                        addMessageElement('user', msg.text, msg.id);
                    } else {
                        addMessageElement('ai', msg.text, msg.id, msg.raw_data);
                        if(msg.raw_data) {
                            // 塞入全局缓存仓库
                            window.chatDataRegistry[msg.id] = msg.raw_data;
                        }
                    }
                });
                // 默认将最后一轮的图表直接在右边渲染出来
                const aiMessages = messages.filter(m => m.role === 'assistant' && m.raw_data);
                if(aiMessages.length > 0) {
                    renderVisualization(aiMessages[aiMessages.length - 1].id);
                }
            }
        });
};

function ask(question) {
    document.getElementById('query-input').value = question;
    sendQuery();
}

function sendQuery() {
    const input = document.getElementById('query-input');
    const query = input.value.trim();
    if (!query) return;

    addMessageElement('user', query, 'temp-user-' + Date.now());
    input.value = '';

    const btn = document.getElementById('send-btn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span>';
    document.getElementById('empty-state').style.display = 'none';

    const thinkingId = addMessageElement('ai', '🤔 正在结合上下文思考并计算数据...', 'thinking');

    fetch('/ai/query', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({query: query})
    })
    .then(r => r.json())
    .then(data => {
        document.getElementById(thinkingId).remove();

        if (data.success) {
            const newMsgId = 'ai-' + Date.now();
            addMessageElement('ai', `✅ 已生成「${data.title}」`, newMsgId, data);

            // 缓存并渲染
            window.chatDataRegistry[newMsgId] = data;
            renderVisualization(newMsgId);
        } else {
            addMessageElement('ai', `❌ ${data.error}`, 'error-' + Date.now());
        }
    })
    .catch(err => {
        if(document.getElementById(thinkingId)) document.getElementById(thinkingId).remove();
        addMessageElement('ai', `❌ 请求失败：${err.message}`, 'error-' + Date.now());
    })
    .finally(() => {
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-send-fill"></i>';
    });
}

// 渲染右侧动态图表与三段式决策面板的主核心函数
function renderVisualization(msgId) {
    const data = window.chatDataRegistry[msgId];
    if (!data) return;

    document.getElementById('empty-state').style.display = 'none';
    document.getElementById('result-area').style.display = 'block';

    // 1. 渲染三段式业务洞察
    let insightHtml = '';
    if (typeof data.insight === 'object' && data.insight !== null) {
        insightHtml = `
            <div style="margin-bottom: 8px;"><span style="font-weight:600; color:#874d00;"><i class="bi bi-clipboard-data"></i> 数据表现：</span><span style="color:#614700;">${data.insight.what || '暂无数据'}</span></div>
            <div style="margin-bottom: 8px;"><span style="font-weight:600; color:#d46b08;"><i class="bi bi-search"></i> 归因分析：</span><span style="color:#614700;">${data.insight.why || '暂无分析'}</span></div>
            <div><span style="font-weight:600; color:#389e0d;"><i class="bi bi-rocket-takeoff"></i> 落地建议：</span><span style="color:#614700;">${data.insight.how || '暂无建议'}</span></div>
        `;
    } else {
        insightHtml = `<div style="color:#614700;">${data.insight}</div>`;
    }

    document.getElementById('insight-text').innerHTML = insightHtml +
        `<div style="margin-top:12px; padding-top:8px; border-top:1px dashed #ffe58f; font-size:12px; color:#b58200; display:flex; gap:15px;">
            <span><i class="bi bi-stopwatch"></i> 链路总耗时: <b>${data.latency}s</b></span>
            <span><i class="bi bi-cpu"></i> 消耗 Token: <b>${data.total_tokens}</b></span>
            <span><i class="bi bi-memory"></i> 会话上下文已就绪</span>
        </div>`;

    // 2. 渲染 SQL 语句
    document.getElementById('sql-text').textContent = data.sql;
    document.getElementById('sql-box').style.display = 'none';

    // 3. 渲染图表标题
    document.getElementById('chart-title').textContent = data.title;

    // 4. 画布重绘
    if (!chart) {
        chart = echarts.init(document.getElementById('main-chart'));
    }
    chart.setOption(data.echarts_option, true);
    setTimeout(() => chart.resize(), 100);

    // 🌟 视觉微调：给当前激活的历史聊天气泡加上高亮蓝色边框特效
    document.querySelectorAll('.ai-bubble').forEach(b => b.style.borderColor = '#ebebeb');
    const activeBubble = document.getElementById(msgId);
    if(activeBubble) activeBubble.style.borderColor = '#5470c6';
}

function addMessageElement(role, text, id, rawData) {
    const history = document.getElementById('chat-history');
    const isUser = role === 'user';
    const div = document.createElement('div');

    div.style.cssText = `margin-bottom:12px; display:flex; justify-content:${isUser ? 'flex-end' : 'flex-start'};`;

    // 如果是 AI 的可视化消息气泡，允许点击触发历史切片闪回
    const cursorStyle = (!isUser && rawData) ? 'cursor:pointer; transition:all 0.2s;' : '';
    const clickHandler = (!isUser && rawData) ? `onclick="renderVisualization('${id}')"` : '';
    const aiBubbleClass = !isUser ? 'ai-bubble' : '';

    div.innerHTML = `
        <div id="${id}" ${clickHandler} class="${aiBubbleClass}"
            style="max-width:88%; padding:10px 14px; border-radius:10px; font-size:13px; line-height:1.5; ${cursorStyle}
            background:${isUser ? '#5470c6' : '#f8f9fa'};
            color:${isUser ? '#fff' : '#333'};
            border: 1px solid ${isUser ? 'transparent' : '#ebebeb'};
            box-shadow: ${isUser ? 'none' : '0 2px 6px rgba(0,0,0,0.02)'};"
            onmouseover="${(!isUser && rawData) ? "this.style.backgroundColor='#f1f3f9'; this.style.transform='translateX(2px)';" : ''}"
            onmouseout="${(!isUser && rawData) ? "this.style.backgroundColor='#f8f9fa'; this.style.transform='none';" : ''}">
            ${!isUser && rawData ? '<i class="bi bi-bar-chart-line-fill text-primary me-1"></i>' : ''}
            ${text}
        </div>`;

    history.appendChild(div);
    history.scrollTop = history.scrollHeight;
    return id;
}

function toggleSQL() {
    const box = document.getElementById('sql-box');
    box.style.display = box.style.display === 'none' ? 'block' : 'none';
}

window.addEventListener('resize', () => { if (chart) chart.resize(); });
</script>

<style>
.suggest-btn {
    display: inline-flex;
    align-items: center;
    margin: 3px;
    padding: 5px 12px;
    background: #f5f8ff;
    border: 1px solid #d6e4ff;
    border-radius: 16px;
    font-size: 12px;
    color: #5470c6;
    cursor: pointer;
    transition: all 0.2s;
}
.suggest-btn:hover { background: #d6e4ff; border-color: #adc6ff; }
#chat-history::-webkit-scrollbar { width: 4px; }
#chat-history::-webkit-scrollbar-thumb { background: #e0e0e0; border-radius: 2px; }
</style>

{% endblock %}
