<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>注册 - 跨境电商智能可视化系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        .register-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            width: 400px;
            padding: 40px 32px;
        }
        .brand-title {
            color: #1a1a2e;
            font-weight: 700;
            font-size: 22px;
            text-align: center;
            margin-bottom: 24px;
        }
    </style>
</head>
<body>

<div class="register-card">
    <div class="brand-title">
        <i class="bi bi-person-plus-fill text-success me-2"></i>新用户注册
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }} alert-dismissible fade show py-2 px-3" role="alert" style="font-size:13px;">
                    {{ message }}
                    <button type="button" class="btn-close py-2" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('auth.register') }}">
        <div class="mb-3">
            <label class="form-label small text-muted">设置用户名</label>
            <div class="input-group input-group-sm">
                <span class="input-group-text"><i class="bi bi-person"></i></span>
                <input type="text" name="username" class="form-control" required placeholder="字母、数字组合">
            </div>
        </div>
        <div class="mb-4">
            <label class="form-label small text-muted">设置密码</label>
            <div class="input-group input-group-sm">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="password" name="password" class="form-control" required placeholder="请输入密码">
            </div>
        </div>
        <button type="submit" class="btn btn-success w-100 btn-sm py-2 fw-semibold">注 册</button>
    </form>
    <div class="text-center mt-3">
        <a href="{{ url_for('auth.login') }}" class="text-decoration-none small text-secondary">已有账号？返回登录</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
