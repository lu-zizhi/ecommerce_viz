<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>跨境电商数据可视化系统</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: #f0f2f5;
            font-family: 'Microsoft YaHei', sans-serif;
        }

        /* 顶部导航栏 */
        .navbar {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            box-shadow: 0 2px 12px rgba(0,0,0,0.3);
            padding: 0 24px;
            height: 56px;
        }
        .navbar-brand {
            color: #fff !important;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 1px;
        }
        .navbar-brand i {
            color: #5470c6;
            margin-right: 8px;
        }
        .nav-link {
            color: rgba(255,255,255,0.75) !important;
            font-size: 14px;
            padding: 6px 16px !important;
            border-radius: 6px;
            transition: all 0.2s;
            margin: 0 2px;
        }
        .nav-link:hover, .nav-link.active {
            color: #fff !important;
            background: rgba(84,112,198,0.35);
        }
        .nav-link i { margin-right: 5px; }

        /* 页面内容区 */
        .main-content {
            padding: 24px;
            min-height: calc(100vh - 56px);
        }

        /* 统计卡片 */
        .stat-card {
            background: #fff;
            border-radius: 12px;
            padding: 20px 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border: 1px solid #f0f0f0;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.1);
        }
        .stat-label {
            font-size: 13px;
            color: #8c8c8c;
            margin-bottom: 8px;
        }
        .stat-value {
            font-size: 26px;
            font-weight: 700;
            color: #1a1a2e;
        }
        .stat-icon {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        /* 图表卡片 */
        .chart-card {
            background: #fff;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border: 1px solid #f0f0f0;
            margin-bottom: 20px;
        }
        .chart-title {
            font-size: 15px;
            font-weight: 600;
            color: #1a1a2e;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid #f5f5f5;
        }
        .chart-title i {
            color: #5470c6;
            margin-right: 6px;
        }

        /* 页面标题 */
        .page-header {
            margin-bottom: 20px;
        }
        .page-header h4 {
            font-size: 20px;
            font-weight: 600;
            color: #1a1a2e;
            margin: 0;
        }
        .page-header p {
            font-size: 13px;
            color: #8c8c8c;
            margin: 4px 0 0;
        }
    </style>
</head>
<body>

<!-- 顶部导航栏 -->
<nav class="navbar navbar-expand-lg">
    <a class="navbar-brand" href="/">
        <i class="bi bi-bar-chart-fill"></i>跨境电商数据可视化系统
    </a>
    <div class="navbar-nav ms-auto">
        <a class="nav-link {% if request.path == '/' or request.path == '/dashboard' %}active{% endif %}"
           href="/dashboard">
            <i class="bi bi-speedometer2"></i>看板
        </a>
        <a class="nav-link {% if '/data' in request.path %}active{% endif %}"
           href="/data">
            <i class="bi bi-database"></i>数据管理
        </a>
        <a class="nav-link {% if '/ai' in request.path %}active{% endif %}"
           href="/ai">
            <i class="bi bi-robot"></i>智能分析
        </a>
    </div>
</nav>

<!-- 主内容区 -->
<div class="main-content">
    {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
