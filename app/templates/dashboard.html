{% extends 'base.html' %}
{% block content %}

<!-- 页面标题 -->
<div class="page-header d-flex justify-content-between align-items-center">
    <div>
        <h4><i class="bi bi-speedometer2 text-primary me-2"></i>数据看板</h4>
        <p>基于 Amazon 跨境电商真实数据 · 2022年3月-6月</p>
    </div>
    <button class="btn btn-sm btn-outline-secondary" onclick="location.reload()">
        <i class="bi bi-arrow-clockwise me-1"></i>刷新
    </button>
</div>

<!-- 顶部统计卡片 -->
<div class="row g-3 mb-4">
    <div class="col-md-3">
        <div class="stat-card d-flex justify-content-between align-items-center">
            <div>
                <div class="stat-label">总销售额 (INR)</div>
                <div class="stat-value" id="total-revenue">-</div>
            </div>
            <div class="stat-icon" style="background:#eff4ff;">
                <i class="bi bi-currency-rupee" style="color:#5470c6;"></i>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="stat-card d-flex justify-content-between align-items-center">
            <div>
                <div class="stat-label">有效订单数</div>
                <div class="stat-value" id="total-orders">-</div>
            </div>
            <div class="stat-icon" style="background:#f0faf0;">
                <i class="bi bi-bag-check" style="color:#91cc75;"></i>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="stat-card d-flex justify-content-between align-items-center">
            <div>
                <div class="stat-label">商品种类数</div>
                <div class="stat-value" id="total-products">-</div>
            </div>
            <div class="stat-icon" style="background:#fff8f0;">
                <i class="bi bi-box-seam" style="color:#fac858;"></i>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="stat-card d-flex justify-content-between align-items-center">
            <div>
                <div class="stat-label">订单取消率</div>
                <div class="stat-value" id="cancel-rate">-</div>
            </div>
            <div class="stat-icon" style="background:#fff0f0;">
                <i class="bi bi-x-circle" style="color:#ee6666;"></i>
            </div>
        </div>
    </div>
</div>

<!-- 销售额趋势（全宽） -->
<div class="chart-card">
    <div class="chart-title">
        <i class="bi bi-graph-up"></i>每日销售额 & 订单数趋势
    </div>
    <div id="chart-revenue" style="height:320px;"></div>
</div>

<!-- 中间两个图表 -->
<div class="row g-3 mb-0">
    <div class="col-md-6">
        <div class="chart-card">
            <div class="chart-title">
                <i class="bi bi-pie-chart"></i>各品类销售额占比
            </div>
            <div id="chart-category" style="height:320px;"></div>
        </div>
    </div>
    <div class="col-md-6">
        <div class="chart-card">
            <div class="chart-title">
                <i class="bi bi-clipboard-data"></i>订单状态分布
            </div>
            <div id="chart-status" style="height:320px;"></div>
        </div>
    </div>
</div>

<!-- 省份订单量（全宽） -->
<div class="chart-card">
    <div class="chart-title">
        <i class="bi bi-geo-alt"></i>各省份订单量 Top10
    </div>
    <div id="chart-state" style="height:320px;"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<script>
const chartRevenue  = echarts.init(document.getElementById('chart-revenue'));
const chartCategory = echarts.init(document.getElementById('chart-category'));
const chartStatus   = echarts.init(document.getElementById('chart-status'));
const chartState    = echarts.init(document.getElementById('chart-state'));

// 汇总数字
fetch('/api/summary').then(r => r.json()).then(data => {
    document.getElementById('total-revenue').textContent = '₹' + data.total_revenue.toLocaleString();
    document.getElementById('total-orders').textContent = data.total_orders.toLocaleString();
    document.getElementById('total-products').textContent = data.total_products.toLocaleString();
    document.getElementById('cancel-rate').textContent = data.cancel_rate + '%';
});

// 每日销售额趋势
fetch('/api/daily-metrics').then(r => r.json()).then(data => {
    chartRevenue.setOption({
        tooltip: { trigger: 'axis', axisPointer: { type: 'cross' } },
        legend: { data: ['销售额', '订单数'], top: 0 },
        grid: { left: 60, right: 60, bottom: 60, top: 40 },
        xAxis: {
            type: 'category', data: data.dates,
            axisLabel: { rotate: 45, fontSize: 10, color: '#8c8c8c' },
            axisLine: { lineStyle: { color: '#e8e8e8' } }
        },
        yAxis: [
            { type: 'value', name: '销售额(INR)',
              axisLabel: { color: '#8c8c8c' },
              splitLine: { lineStyle: { color: '#f5f5f5' } } },
            { type: 'value', name: '订单数',
              axisLabel: { color: '#8c8c8c' } }
        ],
        series: [
            { name: '销售额', type: 'line', data: data.revenue,
              smooth: true, yAxisIndex: 0,
              itemStyle: { color: '#5470c6' },
              areaStyle: { color: { type: 'linear', x: 0, y: 0, x2: 0, y2: 1,
                colorStops: [{ offset: 0, color: 'rgba(84,112,198,0.25)' },
                             { offset: 1, color: 'rgba(84,112,198,0.02)' }] } } },
            { name: '订单数', type: 'line', data: data.orders,
              smooth: true, yAxisIndex: 1,
              itemStyle: { color: '#91cc75' },
              areaStyle: { color: { type: 'linear', x: 0, y: 0, x2: 0, y2: 1,
                colorStops: [{ offset: 0, color: 'rgba(145,204,117,0.2)' },
                             { offset: 1, color: 'rgba(145,204,117,0.02)' }] } } }
        ]
    });
});

// 品类销售占比
fetch('/api/category-sales').then(r => r.json()).then(data => {
    chartCategory.setOption({
        tooltip: { trigger: 'item', formatter: '{b}<br/>₹{c} ({d}%)' },
        legend: { orient: 'vertical', left: 'left', top: 'center',
                  textStyle: { fontSize: 12, color: '#595959' } },
        series: [{
            type: 'pie', radius: ['42%', '68%'],
            center: ['62%', '50%'],
            data: data,
            label: { show: false },
            emphasis: { label: { show: true, fontSize: 13, fontWeight: 'bold' },
                        itemStyle: { shadowBlur: 10, shadowColor: 'rgba(0,0,0,0.2)' } }
        }]
    });
});

// 订单状态分布
fetch('/api/order-status').then(r => r.json()).then(data => {
    chartStatus.setOption({
        tooltip: { trigger: 'item', formatter: '{b}: {c} ({d}%)' },
        legend: { orient: 'vertical', left: 'left', top: 'center',
                  textStyle: { fontSize: 11, color: '#595959' } },
        series: [{
            type: 'pie', radius: ['42%', '68%'],
            center: ['62%', '50%'],
            data: data,
            label: { show: false },
            emphasis: { label: { show: true, fontSize: 12, fontWeight: 'bold' },
                        itemStyle: { shadowBlur: 10, shadowColor: 'rgba(0,0,0,0.2)' } }
        }]
    });
});

// 省份订单量 Top10
fetch('/api/state-orders').then(r => r.json()).then(data => {
    chartState.setOption({
        tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
        grid: { left: 120, right: 40, bottom: 20, top: 20 },
        xAxis: { type: 'value', axisLabel: { color: '#8c8c8c' },
                 splitLine: { lineStyle: { color: '#f5f5f5' } } },
        yAxis: { type: 'category', data: [...data.states].reverse(),
                 axisLabel: { fontSize: 12, color: '#595959' } },
        series: [{
            type: 'bar', data: [...data.counts].reverse(),
            itemStyle: {
                color: { type: 'linear', x: 0, y: 0, x2: 1, y2: 0,
                    colorStops: [{ offset: 0, color: '#5470c6' },
                                 { offset: 1, color: '#91cc75' }] }
            },
            label: { show: true, position: 'right', color: '#595959', fontSize: 11 },
            barMaxWidth: 28
        }]
    });
});

window.addEventListener('resize', () => {
    chartRevenue.resize(); chartCategory.resize();
    chartStatus.resize(); chartState.resize();
});
</script>
{% endblock %}
